# ARTEX 방어 헌트용 지표.
# 값은 2026-10-10에 Hinln/ARTEX 공개 소스를 직접 읽고 확인했다.
# Autumn-27/ARTEX 는 같은 날 공개 HTTPS 에서 404 였다.
# PLURA 가 기준으로 밝힌 v0.3.14 changelog 커밋에서도 같은 문자열을 재확인했다.
# 공격 IP, 배포 ZIP 해시는 공개 산출물을 다시 받아 검증하지 못했으므로 넣지 않는다.

meta:
  repo: https://github.com/Hinln/ARTEX
  commit: f3e3f54b6c93916388a0a3dc6a439893a9abe37a
  commit_note: "2026-10-08 Hinln/ARTEX main. 업데이트 저장소 상수만 Hinln/ARTEX 로 바뀌어 있다."
  v0314_commit: 86162d7edac41afcdd82d8de9ecab512b7e014d6
  v0314_note: "changelog '定版 0.3.14' 커밋. PLURA 1보가 밝힌 분석 기준 버전과 대응한다."
  verified_on: "2026-10-10"
  license_of_studied_project: AGPL-3.0
  incident_note: >
    세 User-Agent 는 공개 소스의 후보 지표이다.
    PLURA 는 금융권 공격 로그와 대조해 검증한 값이 아니라고 명시했다.
    문자열 일치는 도구 식별 후보이며 침해 성공이 아니다.

coverage_gaps:
  - "LLM 이 작성한 클라이언트가 User-Agent 를 아예 넣지 않을 수 있다. PLURA 승인 랩(2026-10-09, ARTEX v0.3.14)에서 그런 GET 8건은 spa-api-recon 정확 일치가 0/8 이었다."
  - "skills/api-recon/scripts/runtime_harvest.js 는 puppeteer-core 로 시스템 Chromium 을 띄운다(파일 머리말 14행, require 40행, chromium 경로 46행). 고정 User-Agent 세 문자열과 다른 브라우저 요청이 된다."
  - "후보 User-Agent 가 없다는 이유만으로 ARTEX 활동이나 침해 가능성을 배제하지 않는다."
  - "공개된 공격 IP 목록과 v0.3.14 배포 ZIP 의 SHA-256 은 이 파일에 없다. 전자는 공개 검증 목록이 없고, 후자는 2026-10-10 에 릴리스 자산을 다시 받아 해시하지 못했다."

