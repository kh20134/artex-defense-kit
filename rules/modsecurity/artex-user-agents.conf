# ModSecurity example. Detection only (pass,log).
# Switch to deny only after authorized-test sources are excluded and the
# rule has been tried on real traffic. A User-Agent match is not proof of
# compromise. Change the rule id if 1001001 is already used.

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)^(?:artex-enrich/1\.0|Mozilla/5\.0 \(spa-api-recon(?: spider)?\))$" \
    "id:1001001,\
    phase:1,\
    pass,\
    log,\
    msg:'ARTEX candidate recon User-Agent (detect only)',\
    tag:'artex-hunt',\
    severity:NOTICE,\
    ver:'artex-hunt/0.1.0'"

# artex-selfupdate is an outbound update client. Do not put it on an inbound WAF.
# ARTEX-worker/1.0 appears only in UI mock data and is intentionally absent.
# Path prefixes such as /api/ are not indicators and are intentionally absent.
