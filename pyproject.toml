[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artex-hunt"
version = "0.1.0"
description = "ARTEX 공개 지표를 근거로 한 방어용 로그·호스트 헌트 도구"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "최규선" }]
keywords = ["detection", "artex", "dfir", "waf", "sigma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
artex-hunt = "artex_hunt.cli:main"

[project.urls]
Homepage = "https://github.com/kh20134/artex-defense-kit"
Documentation = "https://blog.plura.io/ko/respond/financial-sector-hacking-ioc-artex-1st-report/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artex_hunt = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
